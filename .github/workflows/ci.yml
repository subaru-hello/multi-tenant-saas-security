name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-admin
          POSTGRES_DB: tenant_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenant_saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust Wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.0 --locked

      - name: Install dependencies
        run: npm ci

      - name: Check generated Worker types
        run: npm run cloudflare:types -- --check

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path rust/tenant-guard-wasm/Cargo.toml

      - name: Lint Rust Wasm adapter
        run: cargo clippy --manifest-path rust/tenant-guard-wasm/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

      - name: Verify all runtimes and package contents
        run: npm run verify

      - name: Create non-privileged PostgreSQL role
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -d tenant_saas -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE tenant_saas_app LOGIN PASSWORD 'integration-app'" \
            -c "GRANT CONNECT ON DATABASE tenant_saas TO tenant_saas_app" \
            -c "GRANT USAGE, CREATE ON SCHEMA public TO tenant_saas_app"

      - name: Verify PostgreSQL RLS
        env:
          TEST_DATABASE_URL: postgresql://tenant_saas_app:integration-app@127.0.0.1:5432/tenant_saas
        run: npm run test:postgres

      - name: Audit production dependencies
        run: npm audit --omit=dev

  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
