apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tenant-saas
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-saas-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-saas-postgres
        app.kubernetes.io/part-of: tenant-invariant-saas
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: tenant-saas-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init-app-role
              mountPath: /docker-entrypoint-initdb.d/10-app-role.sh
              subPath: 10-app-role.sh
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: init-app-role
          configMap:
            name: postgres-init-app-role
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
