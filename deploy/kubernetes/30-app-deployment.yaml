apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-saas
  namespace: tenant-saas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-saas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-saas
        app.kubernetes.io/part-of: tenant-invariant-saas
    spec:
      containers:
        - name: app
          image: ghcr.io/subaru-hello/multi-tenant-saas-security:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BASE_URL
              value: https://saas.octomblog.com
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tenant-saas-secrets
                  key: APP_DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tenant-saas-secrets
                  key: APP_DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tenant-saas-secrets
                  key: POSTGRES_DB
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: tenant-saas-secrets
                  key: SESSION_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tenant-saas-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tenant-saas-secrets
                  key: GITHUB_CLIENT_SECRET
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
