apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: tenant-saas
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tenant-saas-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tenant-saas
      ports:
        - protocol: TCP
          port: 5432
